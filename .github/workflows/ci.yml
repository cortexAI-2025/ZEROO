name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci
      # Mêmes vérifications que `npm run check`, en étapes séparées et avec des annotations
      # sur la PR (erreurs TypeScript, ESLint, fichiers mal formatés, tests en échec).
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npx eslint . -f json -o eslint-report.json || true
          node -e "
            const report = require('./eslint-report.json');
            let errors = 0;
            for (const file of report) for (const m of file.messages) {
              const path = file.filePath.replace(process.cwd() + '/', '');
              const level = m.severity === 2 ? 'error' : 'warning';
              if (m.severity === 2) errors++;
              console.log('::' + level + ' file=' + path + ',line=' + (m.line || 1) + '::' + (m.ruleId || 'eslint') + ' : ' + m.message.replace(/\\n/g, ' '));
            }
            process.exit(errors ? 1 : 0);
          "
      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          files=$(npx prettier --list-different src || true)
          for f in $files; do echo "::error file=$f::Fichier non formaté (npx prettier --write $f)"; done
          test -z "$files"
      - name: Tests du dashboard administrateur
        run: node --test admin-web/*.test.cjs
      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx jest --ci --reporters=default --reporters=github-actions

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify web production export
        run: npm run build:web

  # Migrations rejouées de zéro puis tests pgTAP (droits, RLS, règles métier) et tests de concurrence
  # sur un Postgres 16 jetable (PostGIS, pgTAP, pg_cron). Aucune base distante n'est touchée.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Préparer PostgreSQL
        run: sudo scripts/localdb/setup-ci.sh
      - name: Migrations et tests de base de données
        env:
          PGUSER: postgres
          PGHOST: localhost
        run: scripts/localdb/run.sh
      - name: Migration sur base peuplée (recopie des données administratives des commerces)
        env:
          PGUSER: postgres
          PGHOST: localhost
        run: scripts/localdb/backfill_check.sh

  # Parcours du site web dans Chromium avec une API simulée (annuaire public, mini-site, précommandes).
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build web et scénarios simulés
        run: npm run e2e:mock

  # Fonctions d'abonnement (billing, stripe-webhook) : les vraies fonctions contre un faux Stripe et
  # une fausse base en mémoire. Aucun appel à Stripe ni à Supabase, aucun secret.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tests des fonctions
        run: deno test -A --no-lock --node-modules-dir=none supabase/functions/_tests/
