<title>ZeeRoo Démo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concept : trois téléphones côte à côte (client, restaurant, livreur) qui partagent une seule commande. Vert ZeeRoo sur encre profonde, fond blanc cassé froid. */
:root{
  --ink:#0b1b1c; --ink-2:#34504c; --mute:#6b7f7b;
  --green:#3aab1a; --green-d:#2a8412; --green-l:#e6f5df;
  --paper:#f6f9f6; --card:#ffffff; --line:#dfe8e2;
  --warn:#c26a00; --warn-l:#fff1dd; --bad:#c0392b; --bad-l:#fde9e6;
  --display:'Outfit','Trebuchet MS',sans-serif; --body:'Figtree','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);padding-inline:16px;padding-block:20px 48px;margin:0}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.top{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between}
.top img{height:56px;display:block}
.top .tag{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.reset{background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px}
.guide{max-width:1240px;margin:18px auto 0;background:var(--ink);color:#fff;border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.guide b{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;background:var(--green);color:var(--ink);padding:4px 9px;border-radius:6px}
.guide span{flex:1;min-width:220px}
.steps{max-width:1240px;margin:12px auto 0;display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.steps i{font-style:normal;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.steps i.on{background:var(--green-l);border-color:var(--green);color:var(--green-d);font-weight:700}
.tabs{display:none;max-width:1240px;margin:18px auto 0;gap:6px}
.tabs button{flex:1;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700}
.tabs button[aria-selected=true]{background:var(--green);color:var(--ink);border-color:var(--green)}
.stage{max-width:1240px;margin:20px auto 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;justify-items:center}
.col{width:100%;max-width:380px;min-width:0}
.col>h2{font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;text-align:center}
.phone{background:var(--card);border:8px solid var(--ink);border-radius:36px;height:760px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.bar img{height:26px}
.bar .t{font:800 17px var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .back{font-size:20px;line-height:1;padding:2px 8px 2px 0}
.body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.foot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.btn{background:var(--green);color:var(--ink);font-weight:700;padding:13px 16px;border-radius:12px;text-align:center;width:100%}
.btn:hover{background:#44bd22}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;width:auto;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.row{display:flex;align-items:center;gap:10px}
.row>.f{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
.h{font:800 20px var(--display);margin:0}
.sub{font:700 15px var(--display);margin:0}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:var(--card)}
.chip[aria-pressed=true]{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.tile{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:800 18px var(--display);color:#fff;flex:none}
.badge{font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--green-l);color:var(--green-d);white-space:nowrap}
.badge.w{background:var(--warn-l);color:var(--warn)}
.badge.k{background:var(--ink);color:#fff}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-weight:800}
.qty span{min-width:16px;text-align:center;font-weight:700}
.code{font:800 34px var(--display);letter-spacing:.3em;text-align:center;padding:8px 0 8px .3em;background:var(--paper);border-radius:12px}
.timeline{display:flex;flex-direction:column;gap:6px}
.timeline div{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:14px}
.timeline div::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.timeline div.done{color:var(--ink);font-weight:600}
.timeline div.done::before{background:var(--green)}
.note{background:var(--warn-l);color:#6b3d00;border-radius:12px;padding:10px 12px;font-size:14px}
.note.ok{background:var(--green-l);color:#1d5c0b}
.note.bad{background:var(--bad-l);color:#7a2118}
.empty{margin:auto;text-align:center;color:var(--mute);padding:20px}
.empty .h{color:var(--ink-2);font-size:17px}
input.t{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font:600 18px var(--display);letter-spacing:.2em;text-align:center}
.sheet{position:absolute;inset:0;background:rgba(11,27,28,.55);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px 20px;display:flex;flex-direction:column;gap:10px}
.dev{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dev button{font-size:12px;padding:6px 10px;border-radius:8px;border:1px dashed var(--mute);color:var(--ink-2)}
.dev .lbl{font-size:12px;color:var(--mute);align-self:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;z-index:20;max-width:92vw;text-align:center}

.tabbar{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 4px 10px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px var(--body);color:var(--mute);padding:6px 2px;border-radius:10px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected=true]{color:var(--green-d)}
.tabbar button[aria-selected=true] svg{stroke:var(--green-d)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked=true]{background:var(--green)}
.sw[aria-checked=true]::after{left:21px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font:600 12px var(--body);color:var(--ink-2);letter-spacing:.03em}
.fld input,.fld textarea,.in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:500 15px var(--body);background:var(--card);color:var(--ink)}
.fld textarea{resize:none;height:64px}
.lr{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.lr:last-child{border-bottom:0}
.lr .f{flex:1;min-width:0}
.lr .chev{color:var(--mute);font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--paper);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:800 22px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:18px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mute)}
.bars i{display:block;width:100%;background:var(--line);border-radius:6px 6px 2px 2px;font-style:normal}
.bars div.cur i{background:var(--green)}
.bars em{font-style:normal;font-weight:700;color:var(--ink);font-size:11px}
.stars{color:#e0a100;letter-spacing:2px}
.starbtn{font-size:30px;line-height:1;color:var(--line);padding:2px}
.starbtn.on{color:#e0a100}
.av{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 24px var(--display);flex:none}
.pill{font:700 11px var(--body);padding:3px 8px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.ok{color:var(--green-d)}
.dist{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.dist .tr{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.dist .tr i{display:block;height:100%;background:var(--green)}
.danger{color:var(--bad);font-weight:700}
.sec{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:6px 0 -4px}
@media(max-width:1020px){
  .tabs{display:flex}
  .stage{grid-template-columns:minmax(0,1fr)}
  .col{display:none;max-width:420px}
  .col.show{display:block}
}
@media(prefers-reduced-motion:no-preference){.btn{transition:background .15s}}
</style>

function track(){
  const x=o(), d=x.fulfil==='delivery';
  const steps=d?[['placed','Envoyée'],['accepted','Acceptée'],['ready','Prête'],['out','En route'],['delivered','Livrée']]:[['placed','Envoyée'],['accepted','Acceptée'],['ready','Prête'],['delivered','Récupérée']];
  const order=['placed','accepted','ready','out','delivered'];
  const idx=order.indexOf(x.status);
  const title={placed:'En attente du restaurant…',accepted:d&&!x.courier?'Acceptée. Un livreur va la prendre.':'Acceptée, en préparation',ready:d?'Commande prête':'C\'est prête !',out:'Votre livreur arrive',delivered:d?'Livrée. Bon appétit !':'Commande récupérée'}[x.status];
  let ride='';
  if(d&&['accepted','ready','out'].includes(x.status)){
    if(!x.courier) ride=`<div class="note">🔎 Recherche d'un livreur…</div>`;
    else if(x.ridePay==='card'&&!x.ridePaid) ride=`<div class="card" style="border-color:var(--green)"><div class="sub">${x.courier} prend votre livraison</div>
      <div class="mute">Réglez la livraison avant <b data-count="${x.due}">${mmss(x.due-Date.now())}</b>, sinon elle sera proposée à un autre livreur.</div>
      <button class="btn" data-act="payRide">Régler la livraison · ${euro(x.fee)}</button></div>`;
    else if(x.ridePay==='card') ride=`<div class="note ok">✅ ${x.courier} livre votre commande. Livraison réglée par carte.</div>`;
    else ride=`<div class="note ok">🛵 ${x.courier} livre votre commande. Prévoyez ${euro(x.fee)} en espèces.</div>`;
  }
  const codeCard=x.status==='out'?`<div class="card"><div class="mute" style="text-align:center">Code de livraison à donner au livreur</div><div class="code">${x.dcode}</div></div>`
    :(!d&&['accepted','ready'].includes(x.status)?`<div class="card"><div class="mute" style="text-align:center">Code de retrait au comptoir</div><div class="code">${x.code}</div></div>`:'');
  const rate=x.status==='delivered'?(S.rated?`<div class="note ok">Merci pour votre avis !</div>`:`<div class="card"><div class="sub">Comment c'était ?</div>
     ${d&&x.courier==='Karim'?`<div class="mute">${esc(x.courier)}, votre livreur</div><div>${[1,2,3,4,5].map(n=>`<button class="starbtn ${S.rateC>=n?'on':''}" data-act="rateC" data-v="${n}" aria-label="${n} étoiles livreur">★</button>`).join('')}</div>`:''}
     <div class="mute">${esc(S.shop.name)}</div><div>${[1,2,3,4,5].map(n=>`<button class="starbtn ${S.rateR>=n?'on':''}" data-act="rateR" data-v="${n}" aria-label="${n} étoiles restaurant">★</button>`).join('')}</div>
     <input class="in" data-path="rateTxt" placeholder="Un commentaire (facultatif)" value="${esc(S.rateTxt)}">
     <button class="btn" data-act="sendRate" ${S.rateR||S.rateC?'':'disabled'}>Envoyer mon avis</button></div>`):'';
  return page('Ma commande',null,`
    <div class="h">${title}</div>
    <div class="timeline">${steps.map(([k,l])=>`<div class="${order.indexOf(k)<=idx?'done':''}">${l}</div>`).join('')}</div>
    ${x.skipNote?`<div class="note bad">${x.skipNote}</div>`:''}
    ${ride}${codeCard}${rate}
    <div class="card"><div class="sub">${esc(S.shop.name)}</div>${x.items.map(l=>`<div class="row"><div class="f">${l.q} × ${esc(l.name)}</div><div class="price">${euro(l.price*l.q)}</div></div>`).join('')}
      <hr style="border:0;border-top:1px solid var(--line);margin:4px 0">
      <div class="row"><div class="f">Repas</div><div class="price">${euro(x.total)}</div></div>
      ${d?`<div class="row"><div class="f">Frais de livraison</div><div class="price">${euro(x.fee)}</div></div>`:''}
      <div class="row"><div class="f"><b>Total</b></div><div class="price">${euro(x.total+(d?x.fee:0))}</div></div>
      <div class="mute">${x.mealPay==='cash'?`Repas : ${euro(x.total)} en espèces au comptoir.`:`Repas : ${euro(x.total)} payés par carte au restaurant.`}</div>
      ${d?`<div class="mute">${x.ridePay==='cash'?`Livraison : ${euro(x.fee)} en espèces au livreur.`:(x.ridePaid?`Livraison : ${euro(x.fee)} payés par carte au livreur.`:`Livraison : ${euro(x.fee)} à régler par carte au livreur.`)}</div>`:''}</div>`,
    x.status==='delivered'?`<button class="btn dark" data-act="newOrder">Nouvelle commande</button>`:'');
}

      ${it.opts.map(p=>`<button class="lr" data-act="pickOpt" data-v="${esc(p.name)}"><div class="f">${esc(p.name)}</div><span class="price">${p.delta?'+'+euro(p.delta):'Offert'}</span><span class="sw" style="pointer-events:none" role="switch" aria-checked="${sel.includes(p.name)}"></span></button>`).join('')}

  const c=S.c, tb=tabbar('c',CTABS,c.tab);
  if(c.sub==='edit') return courierEdit();
  if(c.tab==='earn') return courierEarn(tb);
  if(c.tab==='hist') return courierHist(tb);
  if(c.tab==='me') return courierMe(tb);
  return courierRuns(tb);
}
function courierRuns(tb){
  const x=o(), m=mine()&&x.status!=='delivered'?x:null;
  const load=S.load+(m?1:0);
  const linked=S.links.karim==='approved';
  let body=`<div class="card"><div class="row"><div class="f"><div class="sub">Je suis disponible</div><div class="mute">Charge : ${load} / 2 livraisons</div></div>
    <button class="chip" aria-pressed="${S.avail}" data-act="avail">${S.avail?'Oui':'Non'}</button></div></div>`;
  if(!linked) body+=`<div class="note bad">Chez Samir ne vous a pas (ou plus) rattaché. Demandez à livrer depuis l'onglet Profil.</div>`;
  if(m){
    const d=m,cash=d.ridePay==='cash',F=d.fee;
    const awaiting=!cash&&!d.ridePaid&&['accepted','ready'].includes(d.status);
    body+=`<div class="card" style="border-color:var(--green)">
      <div class="row"><div class="f"><div class="sub">Retrait : ${esc(S.shop.name)}</div><div class="mute">${esc(S.shop.addr)}, ${esc(S.shop.city)} · puis 5 rue Saint-Augustin (650 m)</div></div><span class="badge">${euro(F)}</span></div>
      ${awaiting?`<div class="note">⏳ En attente du règlement du client (avant <b data-count="${d.due}">${mmss(d.due-Date.now())}</b>). Sinon la mission repart chez les autres livreurs.</div>`:''}
      ${!awaiting&&!cash&&d.status!=='out'?`<div class="note ok">Livraison payée par carte.</div>`:''}
      ${cash&&d.status!=='out'?`<div class="note">À encaisser en espèces à la livraison : ${euro(F)}.</div>`:''}
      ${['accepted','ready'].includes(d.status)?`<div class="mute" style="text-align:center">Code de retrait à montrer au restaurant</div><div class="code">${d.code}</div>
        <div class="mute">${d.status==='ready'?'Commande prête : rendez-vous au restaurant.':'Le restaurant prépare la commande (prête dans '+d.prep+' min).'}</div>`:''}
      ${d.status==='out'?`${cash?`<div class="note">Encaissez ${euro(F)} en espèces, puis validez avec le code.</div>`:''}<div class="mute">En route vers 5 rue Saint-Augustin. Digicode 1234.</div>
        <input class="t" data-path="dcodeIn" inputmode="numeric" maxlength="4" placeholder="Code client" value="${S.dcodeIn}" aria-label="Code de livraison">
        <button class="btn" data-act="deliver">Valider la livraison</button>`:''}
      ${['accepted','ready'].includes(d.status)&&!d.ridePaid?`<button class="btn ghost" data-act="release">Abandonner la mission</button>`:''}
      ${S.courierErr?`<div class="note bad">${S.courierErr}</div>`:''}</div>`;
  }
  if(x&&x.status==='delivered'&&x.courier==='Karim') body+=`<div class="note ok">Livraison terminée${x.ridePay==='cash'?' · espèces encaissées':''}. +${euro(x.fee)}</div>`;
  if(x&&x.skipKarim&&!x.courier) body+=`<div class="note">Cette mission ne vous sera plus proposée.</div>`;
  if(x&&x.courier==='Léa') body+=`<div class="note bad">Mission prise par un autre livreur.</div>`;
  if(missionVisible()) body+=`<div class="sub">Missions disponibles</div><div class="mute" style="margin-top:-8px">Le premier qui accepte la prend.</div>
    <div class="card"><div class="row"><div class="f"><div class="sub">${esc(S.shop.name)} → Paris 2e</div><div class="mute">650 m · ${x.status==='ready'?'Prête':'Prête dans '+x.prep+' min'} · ${x.ridePay==='cash'?'espèces':'carte'}</div></div><span class="badge">${euro(x.fee)}</span></div>
      <button class="btn" data-act="accept2">Accepter la mission</button>${S.courierErr?`<div class="note bad">${S.courierErr}</div>`:''}</div>`;
  else if(!m&&!(x&&x.courier==='Léa')&&S.avail&&S.load>=2) body+=`<div class="note">Vous avez déjà 2 livraisons en cours : aucune mission proposée.</div>`;
  else if(!m&&!x&&linked) body+=`<div class="empty"><div class="h">Aucune mission</div><p>Restez disponible : les missions apparaissent quand un restaurant accepte une commande à livrer.</p></div>`;
  return page('Mes courses',null,body,'',tb);
}
function courierEarn(tb){
  const days=CDAYS.map((v,i)=>i===6?v+S.runToday.eur:v);
  const w=days.reduce((a,b)=>a+b,0), n=[8,9,7,11,13,15,3].reduce((a,b)=>a+b,0)+S.runToday.n;
  const cashShare=Math.round((0.3*(w-S.runToday.eur)+S.runToday.cash)/w*100);
  return page('Revenus',null,`
   <div class="grid2"><div class="stat"><b>${euro(days[6])}</b><span>Aujourd'hui · ${3+S.runToday.n} courses</span></div><div class="stat"><b>${euro(w)}</b><span>7 derniers jours · ${n} courses</span></div></div>
   <div class="card"><div class="sub">Gains par jour</div>${barChart(days,DAYS,v=>euro(v))}</div>
   <div class="card"><div class="sub">Répartition</div>
     <div class="dist"><span style="width:92px;color:var(--ink)">Carte</span><span class="tr"><i style="width:${100-cashShare}%"></i></span><span>${100-cashShare} %</span></div>
     <div class="dist"><span style="width:92px;color:var(--ink)">Espèces</span><span class="tr"><i style="width:${cashShare}%"></i></span><span>${cashShare} %</span></div>
     <div class="mute">Les paiements par carte arrivent directement sur votre compte Stripe. Les espèces sont déjà dans votre poche.</div></div>
   <div class="note ok"><b>0 % de commission.</b> Chaque livraison vous est payée en totalité par le client.</div>
   <div class="card"><div class="row"><div class="f"><div class="sub">Compte Stripe</div><div class="mute">Virements automatiques sur •••• 7714</div></div><span class="badge">Actif</span></div></div>`,'',tb);
}

/* ---------- squelette et rendu ---------- */
function render(){
  const keep=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.path;
  $('p-client').innerHTML=client()+sheet();
  $('p-resto').innerHTML=resto();
  $('p-livreur').innerHTML=livreur();
  devbar();hints();tabsUI();
  if(keep){const e=document.querySelector(`[data-path="${keep}"]`);if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(_){}}}
}
function renderExcept(id){
  if(id!=='p-client')$('p-client').innerHTML=client()+sheet();
  if(id!=='p-resto')$('p-resto').innerHTML=resto();
  if(id!=='p-livreur')$('p-livreur').innerHTML=livreur();
  hints();
}
function devbar(){$('dev').innerHTML=`<span class="lbl">Simuler :</span><button data-act="rival">Léa accepte avant vous</button><button data-act="load">Livraisons déjà en cours : ${S.load}</button><button data-act="fast">Délai de paiement dépassé</button>`}
function tabsUI(){
  document.querySelectorAll('[data-col]').forEach(c=>c.classList.toggle('show',c.dataset.col===S.tab));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
}
function hints(){
  const x=o();let i=0,t;
  if(!x){i=0;t='Client : commandez chez Samir, en livraison ou à emporter. Côté restaurant, modifiez le menu ou les réglages : le client le voit aussitôt.'}
  else if(x.status==='placed'){i=1;t='Restaurant : acceptez la commande (le repas est encaissé à ce moment).'}
  else if(x.status==='refused'){i=1;t='Commande refusée : le client n\'est pas débité. Recommencez la démo.'}
  else if(x.status==='accepted'&&x.fulfil==='delivery'&&!x.courier){i=2;t=x.skipKarim?'La mission est revenue dans le pool. Cliquez « Recommencer » pour rejouer, ou faites accepter Léa.':'Livreur : la mission apparaît chez tous les livreurs. Acceptez-la, le premier gagne.'}
  else if(x.courier&&x.ridePay==='card'&&!x.ridePaid&&x.status!=='delivered'){i=3;t='Client : réglez la livraison en un geste. Vous avez 5 minutes, sinon la mission repart.'}
  else if(x.status==='accepted'){i=4;t='Restaurant : marquez la commande prête.'}
  else if(x.status==='ready'){i=4;t=x.fulfil==='delivery'?'Restaurant : entrez le code de retrait du livreur et remettez la commande.':'Restaurant : entrez le code du client pour remettre la commande.'}
  else if(x.status==='out'){i=5;t='Livreur : demandez au client son code de livraison et validez.'}
  else {i=5;t='Terminé. Notez la livraison côté client : la note de Karim se met à jour dans son profil. Puis regardez Activité et Revenus.'}
  $('hint').textContent=t;
  $('steps').innerHTML=['Commande','Acceptation','Mission','Livraison payée','Préparation','Livraison'].map((s,k)=>`<i class="${k===i?'on':''}">${s}</i>`).join('');
}

function newOrder(){
  const d=S.fulfil==='delivery'&&canDeliver();
  S.order={fulfil:d?'delivery':'pickup',mealPay:d?'card':(S.shop.cash?S.mealPay:'card'),ridePay:S.ridePay,fee:fee(),
    items:S.lines.map(l=>({name:l.name+(l.opts.length?' ('+l.opts.join(', ')+')':''),price:l.price,q:l.q})),total:subtotal(),
    status:'placed',code:rnd(4),dcode:rnd(4),prep:S.prep,courier:null,ridePaid:false,due:null,skipKarim:false,counted:false};
  S.rated=false;S.rateC=0;S.rateR=0;S.rateTxt='';S.view='home';S.sheet=null;
}
function releaseMission(note,msg){const x=o();x.courier=null;x.due=null;x.skipKarim=true;x.skipNote=note;S.courierErr='';if(msg)toast(msg)}
function finish(){ // commande terminée : alimente l'activité du restaurant et les revenus du livreur
  const x=o();if(x.counted)return;x.counted=true;
  const d=x.fulfil==='delivery';
  S.stamps=Math.min(10,S.stamps+1);
  S.corders.unshift({id:'n'+rnd(4),when:'À l\'instant',shop:S.shop.name,items:x.items.map(l=>l.q+' × '+l.name),total:x.total,fee:d?x.fee:0,mode:x.fulfil,pay:(d?x.ridePay:x.mealPay)==='cash'?'espèces':'carte',stars:0});
  S.doneToday.rev+=x.total;S.doneToday.n+=1;
  S.hist.unshift({t:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),who:'Nadia',mode:d?'Livraison':'À emporter',total:x.total});
  if(d&&x.courier==='Karim'){S.runToday.eur+=x.fee;S.runToday.n+=1;if(x.ridePay==='cash')S.runToday.cash+=x.fee;
    S.runsToday=S.runsToday||[];S.runsToday.unshift({when:'Aujourd\'hui',from:S.shop.name,to:'Paris 2e',fee:x.fee,pay:x.ridePay==='cash'?'espèces':'carte',stars:0,txt:''})}
}

  rtab(e){S.r.tab=e.dataset.v;S.r.sub=null},ctab(e){S.c.tab=e.dataset.v;S.c.sub=null},

  tog(e){setP(e.dataset.path,!getP(e.dataset.path))},
  set(e){const v=e.dataset.num?+e.dataset.v:e.dataset.v;setP(e.dataset.path,v)},
  editItem(e){S.r.item=e.dataset.id;S.r.sub='item';S.r.confirmDel=false},
  addItem(){const id='n'+rnd(5);S.menu.items.push({id,cat:S.menu.cats[0].id,name:'Nouveau produit',desc:'',price:500,avail:true,opts:[]});S.r.item=id;S.r.sub='item'},
  delItem(){if(!S.r.confirmDel){S.r.confirmDel=true;return}
    const id=S.r.item;S.menu.items=S.menu.items.filter(i=>i.id!==id);S.lines=S.lines.filter(l=>l.id!==id);S.r.sub=null;S.r.confirmDel=false;toast('Produit supprimé.')},
  addOpt(){const n=S.r.newOptName.trim();if(!n){toast('Donnez un nom à l\'option.');return}
    S.menu.items[itemIdx(S.r.item)].opts.push({name:n,delta:S.r.newOptDelta||0});S.r.newOptName='';S.r.newOptDelta=0},
  delOpt(e){S.menu.items[itemIdx(S.r.item)].opts.splice(+e.dataset.k,1)},
  addCat(){const n=S.r.newCat.trim();if(!n){toast('Donnez un nom à la catégorie.');return}S.menu.cats.push({id:'c'+rnd(4),name:n});S.r.newCat=''},
  link(e){S.links[e.dataset.k]=e.dataset.v;toast(e.dataset.v==='approved'?'Livreur accepté.':'Livreur retiré.')},
  reqLink(e){S.links[e.dataset.k]='pending';toast('Demande envoyée au restaurant.')},
  toastPortal(){toast('Dans l\'app, ce bouton ouvre le portail Stripe.')},toastDocs(){toast('Dans l\'app, le document est vérifié par Stripe.')},
};
function addLine(it,sel){
  const opts=it.opts.filter(p=>sel.includes(p.name));
  const price=it.price+opts.reduce((s,p)=>s+p.delta,0), key=it.id+'|'+opts.map(p=>p.name).sort().join(',');
  const l=S.lines.find(l=>l.key===key);
  if(l)l.q++;else S.lines.push({key,id:it.id,name:it.name,opts:opts.map(p=>p.name),price,q:1});
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(t){const a=t.dataset.act;
    if(a.startsWith('ksub:')){S.k.sub=a.slice(5)}
    else if(a.startsWith('sub:')){S.r.sub=a.slice(4)}
    else if(a.startsWith('csub:')){S.c.sub=a.slice(5)}
    else if(A[a])A[a](t);
    render();return}
  const tab=ev.target.closest('[data-tab]');
  if(tab){S.tab=tab.dataset.tab;render()}
});
document.addEventListener('input',ev=>{
  const el=ev.target;if(!el.dataset||!el.dataset.path)return;
  let v=el.value;const ty=el.dataset.type;
  if(ty==='eur')v=Math.max(0,Math.round((parseFloat(String(v).replace(',','.'))||0)*100));
  else if(['pickIn','dcodeIn'].includes(el.dataset.path))v=v.replace(/\D/g,'');
  setP(el.dataset.path,v);
  renderExcept(el.closest('.phone').id);
});
$('reset').addEventListener('click',()=>{const tab=S.tab;S=fresh();S.tab=tab;render()});
setInterval(()=>{
  const x=o();
  document.querySelectorAll('[data-count]').forEach(el=>{el.textContent=mmss(+el.dataset.count-Date.now())});
  if(x&&x.courier&&x.ridePay==='card'&&!x.ridePaid&&x.due&&Date.now()>=x.due&&x.status!=='delivered'){
    const who=x.courier;S.sheet=null;
    releaseMission('Livraison non réglée à temps : la mission est repartie dans le pool.','Délai dépassé : la mission repart dans le pool.');
    if(who==='Léa')x.skipKarim=false;
    render();
  }
},1000);
render();
</script>
