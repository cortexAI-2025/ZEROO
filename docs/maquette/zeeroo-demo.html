<title>ZeeRoo Démo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<script>if(/[?&]embed\b/.test(location.search))document.documentElement.classList.add('embed')</script>
<style>
/* Concept : trois téléphones côte à côte (client, restaurant, livreur) qui partagent une seule commande. Vert ZeeRoo sur encre profonde, fond blanc cassé froid. */
:root{
  --ink:#0b1b1c; --ink-2:#34504c; --mute:#6b7f7b;
  --green:#3aab1a; --green-d:#2a8412; --green-l:#e6f5df;
  --paper:#f6f9f6; --card:#ffffff; --line:#dfe8e2;
  --warn:#c26a00; --warn-l:#fff1dd; --bad:#c0392b; --bad-l:#fde9e6;
  --display:'Outfit','Trebuchet MS',sans-serif; --body:'Figtree','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);padding-inline:16px;padding-block:20px 48px;margin:0}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.top{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;justify-content:space-between}
.top img{height:56px;display:block}
.embed .top img,.embed .top .tag{display:none}
.top .tag{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.reset{background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px}
.guide{max-width:1240px;margin:18px auto 0;background:var(--ink);color:#fff;border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.guide b{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;background:var(--green);color:var(--ink);padding:4px 9px;border-radius:6px}
.guide span{flex:1;min-width:220px}
.steps{max-width:1240px;margin:12px auto 0;display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.steps i{font-style:normal;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.steps i.on{background:var(--green-l);border-color:var(--green);color:var(--green-d);font-weight:700}
.tabs{display:none;max-width:1240px;margin:18px auto 0;gap:6px}
.tabs button{flex:1;padding:10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700}
.tabs button[aria-selected=true]{background:var(--green);color:var(--ink);border-color:var(--green)}
.stage{max-width:1240px;margin:20px auto 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;justify-items:center}
.col{width:100%;max-width:380px;min-width:0}
.col>h2{font:700 13px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;text-align:center}
.phone{background:var(--card);border:8px solid var(--ink);border-radius:36px;height:760px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.bar img{height:26px}
.bar .t{font:800 17px var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .back{font-size:20px;line-height:1;padding:2px 8px 2px 0}
.body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.foot{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.btn{background:var(--green);color:var(--ink);font-weight:700;padding:13px 16px;border-radius:12px;text-align:center;width:100%}
.btn:hover{background:#44bd22}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;width:auto;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.row{display:flex;align-items:center;gap:10px}
.row>.f{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
.h{font:800 20px var(--display);margin:0}
.sub{font:700 15px var(--display);margin:0}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:var(--card)}
.chip[aria-pressed=true]{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.tile{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:800 18px var(--display);color:#fff;flex:none}
.badge{font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--green-l);color:var(--green-d);white-space:nowrap}
.badge.w{background:var(--warn-l);color:var(--warn)}
.badge.k{background:var(--ink);color:#fff}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-weight:800}
.qty span{min-width:16px;text-align:center;font-weight:700}
.code{font:800 34px var(--display);letter-spacing:.3em;text-align:center;padding:8px 0 8px .3em;background:var(--paper);border-radius:12px}
.timeline{display:flex;flex-direction:column;gap:6px}
.timeline div{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:14px}
.timeline div::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.timeline div.done{color:var(--ink);font-weight:600}
.timeline div.done::before{background:var(--green)}
.note{background:var(--warn-l);color:#6b3d00;border-radius:12px;padding:10px 12px;font-size:14px}
.note.ok{background:var(--green-l);color:#1d5c0b}
.note.bad{background:var(--bad-l);color:#7a2118}
.empty{margin:auto;text-align:center;color:var(--mute);padding:20px}
.empty .h{color:var(--ink-2);font-size:17px}
input.t{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font:600 18px var(--display);letter-spacing:.2em;text-align:center}
.sheet{position:absolute;inset:0;background:rgba(11,27,28,.55);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px 20px;display:flex;flex-direction:column;gap:10px}
.dev{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dev button{font-size:12px;padding:6px 10px;border-radius:8px;border:1px dashed var(--mute);color:var(--ink-2)}
.dev .lbl{font-size:12px;color:var(--mute);align-self:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;z-index:20;max-width:92vw;text-align:center}

.tabbar{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 4px 10px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px var(--body);color:var(--mute);padding:6px 2px;border-radius:10px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected=true]{color:var(--green-d)}
.tabbar button[aria-selected=true] svg{stroke:var(--green-d)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked=true]{background:var(--green)}
.sw[aria-checked=true]::after{left:21px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font:600 12px var(--body);color:var(--ink-2);letter-spacing:.03em}
.fld input,.fld textarea,.in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:500 15px var(--body);background:var(--card);color:var(--ink)}
.fld textarea{resize:none;height:64px}
.lr{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.lr:last-child{border-bottom:0}
.lr .f{flex:1;min-width:0}
.lr .chev{color:var(--mute);font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--paper);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:800 22px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:18px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mute)}
.bars i{display:block;width:100%;background:var(--line);border-radius:6px 6px 2px 2px;font-style:normal}
.bars div.cur i{background:var(--green)}
.bars em{font-style:normal;font-weight:700;color:var(--ink);font-size:11px}
.stars{color:#e0a100;letter-spacing:2px}
.starbtn{font-size:30px;line-height:1;color:var(--line);padding:2px}
.starbtn.on{color:#e0a100}
.av{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 24px var(--display);flex:none}
.pill{font:700 11px var(--body);padding:3px 8px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.ok{color:var(--green-d)}
.dist{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.dist .tr{flex:1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.dist .tr i{display:block;height:100%;background:var(--green)}
.danger{color:var(--bad);font-weight:700}
.sec{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:6px 0 -4px}
.strike{text-decoration:line-through;color:var(--mute);font-weight:500;margin-right:6px}
.badge.hh{background:#fff1dd;color:#9a5300}
.badge.pro{background:var(--ink);color:var(--green);letter-spacing:.08em}
.lock{opacity:.62}
.search{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card)}
.search input{border:0;outline:0;flex:1;min-width:0;padding:11px 0;font:500 15px var(--body);background:none;color:var(--ink)}
.search svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;flex:none}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px;border-radius:8px;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--green-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.map{position:relative;height:250px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:#e8f1e6;background-image:linear-gradient(#d5e4d1 1px,transparent 1px),linear-gradient(90deg,#d5e4d1 1px,transparent 1px);background-size:34px 34px}
.map::before{content:'';position:absolute;left:-10%;top:46%;width:130%;height:14px;background:#fff;transform:rotate(-12deg);box-shadow:0 0 0 2px #d7e3d4}
.pin{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font:700 12px var(--body);padding:4px 8px;border-radius:99px;white-space:nowrap}
.pin::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink);border-bottom:0}
.pin.g{background:var(--green);color:var(--ink)}.pin.g::after{border-top-color:var(--green)}
.qr{width:150px;height:150px;margin:0 auto;display:block;border-radius:10px;border:1px solid var(--line)}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pgrid i{aspect-ratio:1;border-radius:50%;border:2.5px solid var(--green);display:grid;place-items:center;font:800 13px var(--display);color:var(--green-d);font-style:normal}
.pgrid i.on{background:var(--green);color:#fff}
.pgrid i.gift{background:var(--ink);border-color:var(--ink);color:#fff;font-size:11px}

@media(max-width:1020px){
  .tabs{display:flex}
  .stage{grid-template-columns:minmax(0,1fr)}
  .col{display:none;max-width:420px}
  .col.show{display:block}
}
@media(prefers-reduced-motion:no-preference){.btn{transition:background .15s}}
</style>

function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}

/* ---------- composants ---------- */
const field=(label,path,o={})=>{const v=getP(path);const val=o.type==='eur'?(v/100).toFixed(2).replace('.',','):v;
  return `<label class="fld"><span>${label}</span>${o.area?`<textarea data-path="${path}" maxlength="200">${esc(val)}</textarea>`:`<input data-path="${path}" data-type="${o.type||'text'}" value="${esc(val)}" ${o.type==='time'?'type="time"':''} ${o.mode?`inputmode="${o.mode}"`:''} ${o.ph?`placeholder="${o.ph}"`:''}>`}</label>`};
const sw=(path,on)=>`<button class="sw" role="switch" aria-checked="${on}" data-act="tog" data-path="${path}" aria-label="Activer"></button>`;
const chips=(path,vals,cur,fmt=x=>x)=>`<div class="chips">${vals.map(v=>`<button class="chip" aria-pressed="${cur===v}" data-act="set" data-path="${path}" data-v="${esc(v)}">${fmt(v)}</button>`).join('')}</div>`;
const row=(title,sub,act,extra='')=>`<button class="lr" data-act="${act}"><div class="f"><div class="sub">${title}</div>${sub?`<div class="mute">${sub}</div>`:''}</div>${extra}<span class="chev">›</span></button>`;
function barChart(vals,labels,fmt){const mx=Math.max(...vals)||1;return `<div class="bars">${vals.map((v,i)=>`<div class="${i===vals.length-1?'cur':''}"><em>${i===vals.length-1?fmt(v):''}</em><i style="height:${Math.max(4,Math.round(v/mx*80))}%"></i>${labels[i]}</div>`).join('')}</div>`}
function page(title,back,body,foot,tabbar){
  return `<div class="bar">${back?`<button class="back" data-act="${back===true?'back':back}" aria-label="Retour">‹</button>`:`<img src="${Z}" alt="ZeeRoo">`}<div class="t">${title}</div></div>
   <div class="body">${body}</div>${foot?`<div class="foot">${foot}</div>`:''}${tabbar||''}`;
}
const tabbar=(who,tabs,cur)=>`<div class="tabbar" role="tablist">${tabs.map(([k,l,i])=>`<button role="tab" aria-selected="${k===cur}" data-act="${who}tab" data-v="${k}">${ic(i)}${l}</button>`).join('')}</div>`;

/* ---------- Client ---------- */
function canOrder(){return S.shop.published&&S.shop.open}
function clientMain(){
  const x=o();
  if(S.view==='home'&&!x) return explore();
  if(S.view==='menu'&&!x){
    const body=S.menu.cats.map(c=>{const its=S.menu.items.filter(i=>i.cat===c.id);if(!its.length)return '';
      return `<div class="sec">${esc(c.name)}</div>`+its.map(m=>{const inCart=S.lines.filter(l=>l.id===m.id).reduce((s,l)=>s+l.q,0);
      return `<div class="card" ${m.avail?'':'style="opacity:.6"'}><div class="row"><div class="f"><div class="sub">${esc(m.name)}</div><div class="mute">${esc(m.desc)}</div>
        <div class="price">${hhActive()&&m.hh?'<span class="strike">'+euro(m.price)+'</span>'+euro(m.hh)+' <span class="badge hh">Happy Hour</span>':euro(m.price)}${m.opts.length?' <span class="mute">· options</span>':''}</div></div>
        ${m.avail?`<div class="qty">${inCart?`<span class="mute">${inCart}</span>`:''}<button data-act="add" data-id="${m.id}" aria-label="Ajouter ${esc(m.name)}">+</button></div>`:'<span class="badge w">Épuisé</span>'}</div></div>`}).join('')}).join('');
    const hhNote=hhActive()?`<div class="note">🍹 Happy Hour en cours : Menu américain à ${euro(800)} jusqu'à 18:00.</div>`:'';
    return page(S.shop.name,true,hhNote+body,subtotal()?`<button class="btn" data-act="toCart">Voir le panier · ${euro(subtotal())}</button>`:'');
  }
  if(S.view==='cart'&&!x){
    const dl=S.fulfil==='delivery'&&canDeliver(), cashMeal=!dl&&S.mealPay==='cash'&&S.shop.cash;
    const total=subtotal();
    return page('Panier',true,`
      ${S.lines.map(l=>`<div class="row"><div class="f">${esc(l.name)}${l.opts.length?`<div class="mute">${esc(l.opts.join(', '))}</div>`:''}</div>
        <div class="qty"><button data-act="dec" data-key="${esc(l.key)}" aria-label="Retirer">−</button><span>${l.q}</span><button data-act="inc" data-key="${esc(l.key)}" aria-label="Ajouter">+</button></div><div class="price" style="min-width:64px;text-align:right">${euro(linePrice(l)*l.q)}</div></div>`).join('')}
      <div class="chips" role="group" aria-label="Mode">
        <button class="chip" aria-pressed="${!dl}" data-act="fulfil" data-v="pickup">À emporter</button>
        <button class="chip" aria-pressed="${dl}" data-act="fulfil" data-v="delivery" ${canDeliver()?'':'disabled style="opacity:.45"'}>🛵 Livraison</button></div>
      <div class="card"><div class="sub">Quand ?</div><div class="chips"><button class="chip" aria-pressed="${S.sched==='asap'}" data-act="sched" data-v="asap">Dès que possible</button><button class="chip" aria-pressed="${S.sched==='later'}" data-act="sched" data-v="later">Programmer à un autre moment</button></div>
        ${S.sched==='later'?`<div class="chips">${['19:30','19:45','20:00','20:15'].map(t=>`<button class="chip" aria-pressed="${S.slot===t}" data-act="slot" data-v="${t}">${t}</button>`).join('')}</div><div class="mute">Créneaux de 15 minutes pendant les horaires d'ouverture, jusqu'à 14 jours à l'avance. Commande programmée : aujourd'hui, ${S.slot}.</div>`:`<div class="mute">L'établissement prépare votre commande dès qu'il l'accepte.</div>`}</div>
      ${!canDeliver()?`<div class="note">Livraison indisponible : ${!S.shop.deliveryOn?'le restaurant ne livre pas pour le moment.':'aucun livreur disponible.'}</div>`:''}
      ${dl?`<div class="card"><div class="mute">Adresse de livraison</div><div>5 rue Saint-Augustin, 75002 Paris</div><div class="mute">650 m du restaurant · dans la zone (${S.shop.radius/1000} km)</div></div>
        <div class="card"><div class="sub">Paiement de la livraison (${euro(fee())})</div>
          <div class="chips"><button class="chip" aria-pressed="${S.ridePay==='card'}" data-act="ridePay" data-v="card">Carte, Apple Pay, Google Pay</button>
          <button class="chip" aria-pressed="${S.ridePay==='cash'}" data-act="ridePay" data-v="cash">Espèces au livreur</button></div>
          <div class="mute">${S.ridePay==='card'?'Vous paierez le livreur via son lien de paiement dès qu\'il prend la livraison.':'Prévoyez l\'appoint : vous remettez la somme au livreur en main propre.'}</div></div>`
      :(S.shop.cash?`<div class="card"><div class="sub">Paiement de la commande</div>
          <div class="chips"><button class="chip" aria-pressed="${S.mealPay==='card'}" data-act="mealPay" data-v="card">Carte, Apple Pay, Google Pay</button>
          <button class="chip" aria-pressed="${S.mealPay==='cash'}" data-act="mealPay" data-v="cash">Espèces au comptoir</button></div></div>`:'')}
      <div class="row"><div class="f">Repas</div><div class="price">${euro(total)}</div></div>
      ${dl?`<div class="row"><div class="f">Frais de livraison (payés au livreur)</div><div class="price">${euro(fee())}</div></div>`:''}
      <div class="row"><div class="f"><b>Total</b></div><div class="price">${euro(total+(dl?fee():0))}</div></div>
      <p class="mute" style="margin:0">${cashMeal?'Vous payez en espèces en récupérant la commande.':'Rien n\'est payé maintenant. Dès que le restaurant accepte, vous le payez directement par carte, Apple Pay ou Google Pay, via son lien de paiement.'+(dl?' La livraison se paie de la même façon au livreur.':'')}</p>`,
      `<button class="btn" data-act="order" ${S.lines.length?'':'disabled'}>${cashMeal?'Commander (paiement au comptoir)':'Commander · '+euro(total+(dl?fee():0))}</button>`);
  }
  return track();
}

function track(){
  const x=o(), d=x.fulfil==='delivery';
  const steps=d?[['placed','Envoyée'],['accepted','Acceptée'],['ready','Prête'],['out','En route'],['delivered','Livrée']]:[['placed','Envoyée'],['accepted','Acceptée'],['ready','Prête'],['delivered','Récupérée']];
  const order=['placed','accepted','ready','out','delivered'];
  const idx=order.indexOf(x.status);
  const title={placed:'En attente du restaurant…',accepted:d&&!x.courier?'Acceptée. Un livreur va la prendre.':'Acceptée, en préparation',ready:d?'Commande prête':'C\'est prête !',out:'Votre livreur arrive',delivered:d?'Livrée. Bon appétit !':'Commande récupérée'}[x.status];
  let ride='';
  if(d&&['accepted','ready','out'].includes(x.status)){
    if(!x.courier) ride=`<div class="note">🔎 Recherche d'un livreur…</div>`;
    else if(x.ridePay==='card'&&!x.ridePaid) ride=payCard('ride','Payer votre livreur '+x.courier,x.fee,x.rideDeclared,x.courier,'PayPal');
    else if(x.ridePay==='card') ride=`<div class="note ok">✅ ${x.courier} a reçu votre paiement de ${euro(x.fee)} pour la livraison.</div>`;
    else ride=`<div class="note ok">🛵 ${x.courier} livre votre commande. Prévoyez ${euro(x.fee)} en espèces.</div>`;
  }
  const mealBox=x.mealPay!=='card'?'':x.status==='placed'?`<div class="note">Vous paierez ${esc(S.shop.name)} par carte dès qu'il aura accepté votre commande.</div>`
    :x.mealPaid?`<div class="note ok">✅ ${esc(S.shop.name)} a reçu votre paiement de ${euro(x.total)}.</div>`
    :payCard('meal','Payer '+S.shop.name,x.total,x.mealDeclared,S.shop.name,'SumUp');
  const codeCard=x.status==='out'?`<div class="card"><div class="mute" style="text-align:center">Code de livraison à donner au livreur</div><div class="code">${x.dcode}</div></div>`
    :(!d&&['accepted','ready'].includes(x.status)?`<div class="card"><div class="mute" style="text-align:center">Code de retrait au comptoir</div><div class="code">${x.code}</div></div>`:'');
  const rate=x.status==='delivered'?(S.rated?`<div class="note ok">Merci pour votre avis !</div>`:`<div class="card"><div class="sub">Comment c'était ?</div>
     ${d&&x.courier==='Karim'?`<div class="mute">${esc(x.courier)}, votre livreur</div><div>${[1,2,3,4,5].map(n=>`<button class="starbtn ${S.rateC>=n?'on':''}" data-act="rateC" data-v="${n}" aria-label="${n} étoiles livreur">★</button>`).join('')}</div>`:''}
     <div class="mute">${esc(S.shop.name)}</div><div>${[1,2,3,4,5].map(n=>`<button class="starbtn ${S.rateR>=n?'on':''}" data-act="rateR" data-v="${n}" aria-label="${n} étoiles restaurant">★</button>`).join('')}</div>
     <input class="in" data-path="rateTxt" placeholder="Un commentaire (facultatif)" value="${esc(S.rateTxt)}">
     <button class="btn" data-act="sendRate" ${S.rateR||S.rateC?'':'disabled'}>Envoyer mon avis</button></div>`):'';
  return page('Ma commande',null,`
    <div class="h">${title}</div>
    ${x.when?`<div class="note ok">🗓️ Commande programmée : aujourd'hui, ${x.when}.</div>`:''}
    <div class="timeline">${steps.map(([k,l])=>`<div class="${order.indexOf(k)<=idx?'done':''}">${l}</div>`).join('')}</div>
    ${x.skipNote?`<div class="note bad">${x.skipNote}</div>`:''}
    ${mealBox}${ride}${codeCard}${rate}
    <div class="card"><div class="sub">${esc(S.shop.name)}</div>${x.items.map(l=>`<div class="row"><div class="f">${l.q} × ${esc(l.name)}</div><div class="price">${euro(l.price*l.q)}</div></div>`).join('')}
      <hr style="border:0;border-top:1px solid var(--line);margin:4px 0">
      <div class="row"><div class="f">Repas</div><div class="price">${euro(x.total)}</div></div>
      ${d?`<div class="row"><div class="f">Frais de livraison</div><div class="price">${euro(x.fee)}</div></div>`:''}
      <div class="row"><div class="f"><b>Total</b></div><div class="price">${euro(x.total+(d?x.fee:0))}</div></div>
      <div class="mute">${x.mealPay==='cash'?`Repas : ${euro(x.total)} en espèces au comptoir.`:(x.mealPaid?`Repas : ${euro(x.total)} payés par carte au restaurant.`:`Repas : ${euro(x.total)} à payer au restaurant (carte).`)}</div>
      ${d?`<div class="mute">${x.ridePay==='cash'?`Livraison : ${euro(x.fee)} en espèces au livreur.`:(x.ridePaid?`Livraison : ${euro(x.fee)} payés par carte au livreur.`:`Livraison : ${euro(x.fee)} à payer au livreur (carte).`)}</div>`:''}
      <div class="mute">Paiements directs aux professionnels : ZeeRoo n'encaisse rien.</div></div>`,
    x.status==='delivered'?`<button class="btn dark" data-act="newOrder">Nouvelle commande</button>`:'');
}
// Paiement direct : le client ouvre la page de paiement du professionnel (son lien SumUp, PayPal…).
function payCard(kind,title,amount,declared,who,provider){
  return `<div class="card" style="border-color:var(--green)"><div class="row"><div class="sub f">${esc(title)}</div><div class="price">${euro(amount)}</div></div>
    ${declared?`<div class="note">Vous avez payé. ${esc(who)} confirme la réception.</div>`
      :`<div class="mute">Carte, Apple Pay ou Google Pay, sur la page de paiement de ${esc(who)} (${provider}). L'argent va directement sur son compte.</div>
      <button class="btn" data-act="${kind==='meal'?'payMeal':'payRide'}">Payer ${euro(amount)}</button>`}</div>`;
}
function sheet(){
  if(S.pick){const it=S.menu.items[itemIdx(S.pick.id)];const sel=S.pick.sel;

function liveOrder(){
  const x=o();
  if(!x) return `<div class="empty" style="padding:28px 12px"><div class="h">Aucune commande en cours</div><p>Les commandes arrivent ici avec une alerte sonore.</p></div>`;
  const d=x.fulfil==='delivery';
  const head=`<div class="row"><div class="f"><div class="sub">Nadia · ${d?'🛵 Livraison':'À emporter'}</div><div class="mute">Code ${x.code}${x.when?' · 🗓️ programmée '+x.when:''}</div></div><span class="badge ${x.status==='placed'?'w':''}">${{placed:'Nouvelle',accepted:'En préparation',ready:'Prête',out:'Partie',delivered:'Terminée'}[x.status]}</span></div>
    ${x.items.map(l=>`<div class="row"><div class="f">${l.q} × ${esc(l.name)}</div></div>`).join('')}
    <div class="mute">${euro(x.total)} · ${x.mealPay==='cash'?'espèces au comptoir':'carte via votre lien de paiement'}</div>
    ${x.mealPay!=='card'||x.status==='placed'||x.status==='refused'?'':x.mealPaid?`<div class="note ok">Repas payé : ${euro(x.total)} reçus.</div>`
      :`<div class="note">${x.mealDeclared?'Le client indique avoir payé '+euro(x.total)+' : vérifiez la réception.':'En attente du paiement du client ('+euro(x.total)+').'}</div><button class="btn sm" data-act="confirmMeal">Paiement reçu</button>`}`;
  let act='';
  if(x.status==='placed') act=`<div class="mute">Temps de préparation</div><div class="chips">${[10,15,20,30].map(m=>`<button class="chip" aria-pressed="${S.prep===m}" data-act="prep" data-v="${m}">${m} min</button>`).join('')}</div>
    <button class="btn" data-act="accept">Accepter</button><button class="btn ghost" data-act="refuse">Refuser</button>`;

   <div class="card"><div class="row"><div class="sub f">Entreprise</div><button class="btn sm ghost" data-act="csub:edit">Modifier</button></div>
     <div class="row"><div class="f mute">Statut</div><div>${esc(c.legal)}</div></div><div class="row"><div class="f mute">SIRET</div><div>${esc(c.siret)} <span class="${luhn(c.siret)?'ok':'danger'}">${luhn(c.siret)?'✓':'✗'}</span></div></div>

     <div class="chips"><button class="chip" aria-pressed="${S.cplan==='start'}" data-act="cplan" data-v="start">Start</button><button class="chip" aria-pressed="${S.cplan==='pro'}" data-act="cplan" data-v="pro">Pro</button></div>
     <div class="mute">Le changement de formule modifie votre abonnement existant, au prorata.</div></div>

/* ---------- squelette et rendu ---------- */
function render(){
  const keep=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.path;
  $('p-client').innerHTML=client()+sheet();
  $('p-resto').innerHTML=resto();
  $('p-livreur').innerHTML=livreur();
  devbar();hints();tabsUI();
  if(keep){const e=document.querySelector(`[data-path="${keep}"]`);if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(_){}}}
}
function renderExcept(id){
  if(id!=='p-client')$('p-client').innerHTML=client()+sheet();
  if(id!=='p-resto')$('p-resto').innerHTML=resto();
  if(id!=='p-livreur')$('p-livreur').innerHTML=livreur();
  hints();
}
function devbar(){$('dev').innerHTML=`<span class="lbl">Simuler :</span><button data-act="rival">Léa accepte avant vous</button><button data-act="load">Livraisons déjà en cours : ${S.load}</button>`}
function tabsUI(){
  document.querySelectorAll('[data-col]').forEach(c=>c.classList.toggle('show',c.dataset.col===S.tab));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
}
function hints(){
  const x=o();let i=0,t;
  if(!x){i=0;t='Client : trouvez Chez Samir dans l\'annuaire (À proximité) et commandez, en livraison ou à emporter. Côté restaurant, coupez le Happy Hour ou modifiez le menu : le client le voit aussitôt.'}
  else if(x.status==='placed'){i=1;t='Restaurant : acceptez la commande : le client peut alors vous payer (lien de paiement ou espèces).'}
  else if(x.status==='refused'){i=1;t='Commande refusée : le client n\'a rien payé. Recommencez la démo.'}
  else if(x.status==='accepted'&&x.fulfil==='delivery'&&!x.courier){i=2;t=x.skipKarim?'La mission est revenue dans le pool. Cliquez « Recommencer » pour rejouer, ou faites accepter Léa.':'Livreur : la mission apparaît chez tous les livreurs. Acceptez-la, le premier gagne.'}
  else if(x.status==='accepted'&&x.mealPay==='card'&&!x.mealDeclared&&!x.mealPaid){i=3;t='Client : payez le restaurant via son lien de paiement (carte, Apple Pay, Google Pay).'}
  else if(x.courier&&x.ridePay==='card'&&!x.rideDeclared&&!x.ridePaid&&x.status!=='delivered'){i=3;t='Client : payez votre livreur via son lien de paiement.'}
  else if(x.mealDeclared&&!x.mealPaid){i=3;t='Restaurant : vérifiez la réception puis appuyez sur « Paiement reçu ».'}
  else if(x.rideDeclared&&!x.ridePaid&&x.status!=='delivered'){i=3;t='Livreur : vérifiez la réception puis appuyez sur « Paiement reçu ».'}
  else if(x.status==='accepted'){i=4;t='Restaurant : marquez la commande prête.'}
  else if(x.status==='ready'){i=4;t=x.fulfil==='delivery'?'Restaurant : entrez le code de retrait du livreur et remettez la commande.':'Restaurant : entrez le code du client pour remettre la commande.'}
  else if(x.status==='out'){i=5;t='Livreur : demandez au client son code de livraison et validez.'}
  else {i=5;t='Terminé. Notez la livraison côté client : la note de Karim se met à jour dans son profil. Puis regardez Activité et Revenus.'}
  $('hint').textContent=t;
  $('steps').innerHTML=['Commande','Acceptation','Mission','Paiements','Préparation','Livraison'].map((s,k)=>`<i class="${k===i?'on':''}">${s}</i>`).join('');
}

/* ---------- actions ---------- */
function newOrder(){
  const d=S.fulfil==='delivery'&&canDeliver();
  S.order={fulfil:d?'delivery':'pickup',mealPay:d?'card':(S.shop.cash?S.mealPay:'card'),ridePay:S.ridePay,fee:fee(),
    items:S.lines.map(l=>({name:l.name+(l.opts.length?' ('+l.opts.join(', ')+')':''),price:linePrice(l),q:l.q})),total:subtotal(),when:S.sched==='later'?S.slot:null,
    status:'placed',code:rnd(4),dcode:rnd(4),prep:S.prep,courier:null,ridePaid:false,rideDeclared:false,mealPaid:false,mealDeclared:false,due:null,skipKarim:false,counted:false};
  S.rated=false;S.rateC=0;S.rateR=0;S.rateTxt='';S.view='home';S.sheet=null;
}
function releaseMission(note,msg){const x=o();x.courier=null;x.due=null;x.rideDeclared=false;x.skipKarim=true;x.skipNote=note;S.courierErr='';if(msg)toast(msg)}
function finish(){ // commande terminée : alimente l'activité du restaurant et les revenus du livreur
  const x=o();if(x.counted)return;x.counted=true;
  const d=x.fulfil==='delivery';
  S.stamps=Math.min(9,S.stamps+1);
  S.corders.unshift({id:'n'+rnd(4),when:'À l\'instant',shop:S.shop.name,items:x.items.map(l=>l.q+' × '+l.name),total:x.total,fee:d?x.fee:0,mode:x.fulfil,pay:(d?x.ridePay:x.mealPay)==='cash'?'espèces':'carte',stars:0});
  S.doneToday.rev+=x.total;S.doneToday.n+=1;
  S.hist.unshift({t:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),who:'Nadia',mode:d?'Livraison':'À emporter',total:x.total});
  if(d&&x.courier==='Karim'){S.runToday.eur+=x.fee;S.runToday.n+=1;if(x.ridePay==='cash')S.runToday.cash+=x.fee;
    S.runsToday=S.runsToday||[];S.runsToday.unshift({when:'Aujourd\'hui',from:S.shop.name,to:'Paris 2e',fee:x.fee,pay:x.ridePay==='cash'?'espèces':'carte',stars:0,txt:''})}
}
const A={
  openMenu(){S.view='menu'},
  back(){S.view=S.view==='cart'?'menu':'home'},
  add(e){const it=S.menu.items[itemIdx(e.dataset.id)];if(!it||!it.avail)return;if(it.opts.length)S.pick={id:it.id,sel:[]};else addLine(it,[])},
  pickOpt(e){const v=e.dataset.v,s=S.pick.sel;const i=s.indexOf(v);i<0?s.push(v):s.splice(i,1)},
  pickAdd(){const it=S.menu.items[itemIdx(S.pick.id)];addLine(it,S.pick.sel);S.pick=null},
  pickCancel(){S.pick=null},
  inc(e){const l=S.lines.find(l=>l.key===e.dataset.key);if(l)l.q++},
  dec(e){const l=S.lines.find(l=>l.key===e.dataset.key);if(l){l.q--;if(l.q<=0)S.lines=S.lines.filter(x=>x!==l)}},
  toCart(){S.view='cart'},
  fulfil(e){S.fulfil=e.dataset.v},ridePay(e){S.ridePay=e.dataset.v},mealPay(e){S.mealPay=e.dataset.v},
  order(){
    const dl=S.fulfil==='delivery'&&canDeliver(),cash=!dl&&S.mealPay==='cash'&&S.shop.cash;
    newOrder();toast(cash?'Commande envoyée, paiement au comptoir.':'Commande envoyée. Vous paierez le restaurant dès qu\'il accepte.');
  },
  sheetPay(){const x=o();if(S.sheet.kind==='meal')x.mealDeclared=true;else x.rideDeclared=true;const who=S.sheet.who;S.sheet=null;toast('Paiement envoyé à '+who+'. Il confirme la réception.')},
  sheetCancel(){S.sheet=null;toast('Paiement annulé.')},
  payMeal(){const x=o();if(!x||x.mealPaid)return;S.sheet={kind:'meal',who:S.shop.name,provider:'SumUp',amount:x.total}},
  payRide(){const x=o();if(!x.courier||x.ridePaid)return;S.sheet={kind:'ride',who:x.courier,provider:'PayPal',amount:x.fee}},
  confirmMeal(){o().mealPaid=true;toast('Paiement du repas confirmé.')},
  confirmRide(){o().ridePaid=true;toast('Paiement de la livraison confirmé.')},
  newOrder(){S.order=null;S.lines=[{key:'k|',id:'k',name:'Kebab galette',opts:[],price:850,q:1}];S.view='home'},
  rateC(e){S.rateC=+e.dataset.v},rateR(e){S.rateR=+e.dataset.v},
  sendRate(){
    if(S.rateR){S.rating.r.sum+=S.rateR;S.rating.r.count++}
    if(S.rateC&&o().courier==='Karim'){S.rating.c.sum+=S.rateC;S.rating.c.count++;
      if(S.runsToday&&S.runsToday[0]){S.runsToday[0].stars=S.rateC;S.runsToday[0].txt=S.rateTxt}
      S.reviews.unshift({stars:S.rateC,txt:S.rateTxt||'(sans commentaire)',who:'Nadia'})}
    S.rated=true;toast('Merci ! Les notes sont mises à jour.');
  },
  prep(e){S.prep=+e.dataset.v},
  accept(){const x=o();x.status='accepted';x.prep=S.prep;S.restoErr='';toast(x.mealPay==='cash'?'Commande acceptée.':'Commande acceptée : le client peut vous payer.')},
  refuse(){o().status='refused';toast('Commande refusée : le client n\'a rien payé.')},
  ready(){o().status='ready'},
  collect(){const x=o();if(S.pickIn!==x.code){S.restoErr='Code de retrait incorrect.';return}x.status='delivered';S.restoErr='';S.pickIn='';finish()},
  handover(){const x=o();S.restoErr='';
    if(!x.courier){S.restoErr='Aucun livreur n\'a pris la livraison.';return}
    if(S.pickIn!==x.code){S.restoErr='Code de retrait incorrect.';return}
    x.status='out';S.pickIn=''},
  avail(){S.avail=!S.avail},
  accept2(){const x=o();if(S.load>=cap()){S.courierErr='Vous avez déjà '+cap()+' livraison'+(cap()>1?'s':'')+' en cours.';return}
    x.courier='Karim';x.skipNote='';S.courierErr='';
    toast(x.ridePay==='card'?'Mission acceptée : le client vous paie via votre lien.':'Mission acceptée : livraison en espèces.')},
  release(){releaseMission('Votre livreur a abandonné la mission. Elle est reproposée à d\'autres livreurs.','Mission abandonnée.')},
  deliver(){const x=o();if(S.dcodeIn!==x.dcode){S.courierErr='Code de livraison incorrect.';return}
    x.status='delivered';S.dcodeIn='';S.courierErr='';finish();toast(x.ridePay==='cash'?'Livré. Espèces encaissées.':'Livraison validée.')},
  rival(){const x=o();if(!x||!missionVisible()){toast('Aucune mission à prendre pour le moment.');return}
    x.courier='Léa';toast('Léa a accepté la mission avant vous.')},
  load(){S.load=(S.load+1)%(cap()+1)},
  fast(){const x=o();if(x&&x.courier&&x.ridePay==='card'&&!x.ridePaid)x.due=Date.now()-1;else toast('Acceptez une mission avec une livraison par carte d\'abord.')},
  /* tableau de bord client */
  ktab(e){S.k.tab=e.dataset.v;S.k.sub=null},kback(){S.k.sub=null},
  kopen(e){S.k.oi=e.dataset.id;S.k.sub='order'},
  reorder(){const c=S.corders.find(c=>c.id===S.k.oi);if(!c)return;
    S.lines=[];c.items.forEach(t=>{const m=t.match(/^(\d+) × (.*)$/);const it=S.menu.items.find(i=>i.name===m[2]);if(it&&it.avail)S.lines.push({key:it.id+'|',id:it.id,name:it.name,opts:[],price:it.price,q:+m[1]})});
    if(!S.lines.length){toast('Ces produits ne sont plus disponibles.');return}
    if(o()&&['delivered','refused'].includes(o().status))S.order=null;S.k.tab='home';S.k.sub=null;S.view='cart';toast('Commande reprise dans le panier.')},
  addAddr(){const n=S.k.newAddr.trim();if(!n){toast('Saisissez une adresse.');return}S.me.addrs.push({id:'a'+rnd(4),label:'Autre',line:n,def:false});S.k.newAddr=''},
  defAddr(e){S.me.addrs.forEach(a=>a.def=a.id===e.dataset.id)},
  delAddr(e){if(S.me.addrs.length<2){toast('Gardez au moins une adresse.');return}const was=S.me.addrs.find(a=>a.id===e.dataset.id).def;S.me.addrs=S.me.addrs.filter(a=>a.id!==e.dataset.id);if(was)S.me.addrs[0].def=true},
  fav(e){S.me.favs[e.dataset.k]=!S.me.favs[e.dataset.k]},
  delCard(){S.me.card=!S.me.card;toast(S.me.card?'Carte ajoutée.':'Carte supprimée.')},
  toastK(){toast('Dans l\'app, ceci ouvre la page correspondante.')},
  /* tableaux de bord */
  rtab(e){S.r.tab=e.dataset.v;S.r.sub=null},ctab(e){S.c.tab=e.dataset.v;S.c.sub=null},
  rback(){S.r.sub=null;S.r.confirmDel=false},cback(){S.c.sub=null},
  tog(e){setP(e.dataset.path,!getP(e.dataset.path))},
  set(e){const v=e.dataset.num?+e.dataset.v:e.dataset.v;setP(e.dataset.path,v)},
  editItem(e){S.r.item=e.dataset.id;S.r.sub='item';S.r.confirmDel=false},
  addItem(){const id='n'+rnd(5);S.menu.items.push({id,cat:S.menu.cats[0].id,name:'Nouveau produit',desc:'',price:500,avail:true,opts:[]});S.r.item=id;S.r.sub='item'},
  delItem(){if(!S.r.confirmDel){S.r.confirmDel=true;return}
    const id=S.r.item;S.menu.items=S.menu.items.filter(i=>i.id!==id);S.lines=S.lines.filter(l=>l.id!==id);S.r.sub=null;S.r.confirmDel=false;toast('Produit supprimé.')},
  addOpt(){const n=S.r.newOptName.trim();if(!n){toast('Donnez un nom à l\'option.');return}
    S.menu.items[itemIdx(S.r.item)].opts.push({name:n,delta:S.r.newOptDelta||0});S.r.newOptName='';S.r.newOptDelta=0},
  delOpt(e){S.menu.items[itemIdx(S.r.item)].opts.splice(+e.dataset.k,1)},
  addCat(){const n=S.r.newCat.trim();if(!n){toast('Donnez un nom à la catégorie.');return}S.menu.cats.push({id:'c'+rnd(4),name:n});S.r.newCat=''},
  link(e){S.links[e.dataset.k]=e.dataset.v;toast(e.dataset.v==='approved'?'Livreur accepté.':'Livreur retiré.')},
  reqLink(e){S.links[e.dataset.k]='pending';toast('Demande envoyée au restaurant.')},
  hview(e){S.hm.view=e.dataset.v},hf(e){S.hm.f[e.dataset.v]=!S.hm.f[e.dataset.v]},hclear(){S.hm.f={open:false,pickup:false,delivery:false,hh:false};S.hm.q=''},
  toastDemo(){toast('Dans la démo, seul Chez Samir prend des commandes.')},
  sched(e){S.sched=e.dataset.v},slot(e){S.slot=e.dataset.v},
  upgrade(){S.shop.plan='pro';toast('Formule Pro activée : les fonctions Pro sont débloquées.')},
  plan(e){S.shop.plan=e.dataset.v;toast(e.dataset.v==='pro'?'Formule Pro : abonnement modifié, au prorata.':'Formule Start : les réglages Pro sont conservés mais inactifs.')},
  cplan(e){S.cplan=e.dataset.v;if(S.load>cap())S.load=cap();toast(e.dataset.v==='pro'?'Livreur Pro : 2 courses et livraisons de nuit.':'Livreur Start : une course à la fois.')},
  toastPortal(){toast('Dans l\'app, ce bouton ouvre le portail Stripe.')},toastDocs(){toast('Dans l\'app, le document est vérifié par Stripe.')},
};
function addLine(it,sel){
  const opts=it.opts.filter(p=>sel.includes(p.name));
  const price=unit(it)+opts.reduce((s,p)=>s+p.delta,0), key=it.id+'|'+opts.map(p=>p.name).sort().join(',');
  const l=S.lines.find(l=>l.key===key);
  if(l)l.q++;else S.lines.push({key,id:it.id,name:it.name,opts:opts.map(p=>p.name),price,q:1});
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(t){const a=t.dataset.act;
    if(a.startsWith('ksub:')){S.k.sub=a.slice(5)}
    else if(a.startsWith('sub:')){S.r.sub=a.slice(4)}
    else if(a.startsWith('csub:')){S.c.sub=a.slice(5)}
    else if(A[a])A[a](t);
    render();return}
  const tab=ev.target.closest('[data-tab]');
  if(tab){S.tab=tab.dataset.tab;render()}
});
document.addEventListener('input',ev=>{
  const el=ev.target;if(!el.dataset||!el.dataset.path)return;
  let v=el.value;const ty=el.dataset.type;
  if(ty==='eur')v=Math.max(0,Math.round((parseFloat(String(v).replace(',','.'))||0)*100));
  else if(['pickIn','dcodeIn'].includes(el.dataset.path))v=v.replace(/\D/g,'');
  setP(el.dataset.path,v);
  if(el.dataset.path==='hm.q')render();else renderExcept(el.closest('.phone').id);
});
$('reset').addEventListener('click',()=>{const tab=S.tab;S=fresh();S.tab=tab;render()});
setInterval(()=>{
  const x=o();
  document.querySelectorAll('[data-count]').forEach(el=>{el.textContent=mmss(+el.dataset.count-Date.now())});
  if(x&&x.courier&&x.ridePay==='card'&&!x.ridePaid&&x.due&&Date.now()>=x.due&&x.status!=='delivered'){
    const who=x.courier;S.sheet=null;
    releaseMission('Livraison non réglée à temps : la mission est repartie dans le pool.','Délai dépassé : la mission repart dans le pool.');
    if(who==='Léa')x.skipKarim=false;
    render();
  }
},1000);
render();
